services:
  resume-ui:
    build: .
    container_name: resume-ui
    networks:
      - proxy-net
    labels:
      - traefik.enable=true
      - traefik.http.routers.resume.rule=Host(`resume.fynn-koch.de`)
      - traefik.http.routers.resume.entrypoints=websecure
      - traefik.http.routers.resume.tls.certresolver=letsencrypt
      - traefik.http.services.resume.loadbalancer.server.port=80
    restart: unless-stopped

networks:
  proxy-net:
    name: proxy-net
    external: true
